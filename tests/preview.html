<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Marble Parade — mechanism preview</title><style>body{margin:0;background:#f3eddd;font:14px Arial;color:#435868}#world{height:calc(100vh - 120px);width:100%;}nav{padding:15px;display:flex;gap:9px;flex-wrap:wrap}button,select{padding:9px;background:#e3eddf;border:1px solid #94b49e;border-radius:8px;color:#435868}#status{margin:0 15px}#events{font-size:11px;max-width:95%;margin:8px 15px}</style><nav><select aria-label="Preview table" id="level"></select><button id="load">Load solution</button><button id="run">Run solution</button><button id="pause">Pause</button><button id="theme">Change theme</button><button id="skin">Change skin</button></nav><p id="status"></p><p id="events"></p><div id="world"></div><script type="module">
import {Puzzle,freshProfile} from '/src/simulation.ts';import {LEVELS} from '/src/levels.ts';import {MarbleWorld} from '/src/world.ts';
const select=document.querySelector('#level');select.innerHTML=LEVELS.map((l,i)=>`<option value="${i}">${i+1} — ${l.name}</option>`).join('');const profile=freshProfile(),world=new MarbleWorld(document.querySelector('#world'),profile);let game=new Puzzle(0),events=[];
function load(){game=new Puzzle(Number(select.value));for(const c of game.config.solution)game.place(c.x,c.z,c.kind,c.rot);world.reset();events=[];}load();document.querySelector('#load').onclick=load;document.querySelector('#run').onclick=()=>{game.retry();game.start();events=[]};document.querySelector('#pause').onclick=()=>game.phase==='paused'?game.start():game.pause();document.querySelector('#theme').onclick=()=>profile.theme=(profile.theme+1)%3;document.querySelector('#skin').onclick=()=>profile.skin=(profile.skin+1)%3;select.onchange=load;
let last=performance.now(),acc=0;function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;acc+=dt;while(acc>=1/60){game.tick(1/60);acc-=1/60;}for(const e of game.events.splice(0)){world.event(e);events.push(e.type+(e.cell?'@'+e.cell:''));}world.update(game,dt,game.phase==='running'?acc*60:1);document.querySelector('#status').textContent=JSON.stringify(game.snapshot());document.querySelector('#events').textContent=events.join(' · ');requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
